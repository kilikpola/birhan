name: CI

# Runs on every PR and on pushes to main. Make these jobs "required status
# checks" in branch protection (Settings → Branches) so a red run blocks merge.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile — typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --ci

  admin-web:
    name: Admin web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      # No Sentry auth token in PR builds → the vite plugin disables itself and
      # the build (incl. typecheck via `tsc -b`) still validates the app.
      # src/api.ts throws at import time without this, so the build needs a
      # value even though CI never calls the API.
      - run: npm run build
        env:
          VITE_API_URL: https://api.birhan.online

  # Optional guard: fails the job only if lint config exists and reports errors.
  # Kept non-blocking (no eslint config committed yet); promote to required once
  # an eslint baseline is added.
  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx expo lint || true
