name: Preview (admin web)

# Every PR gets a throwaway Cloudflare Pages preview URL for the admin console,
# built against the STAGING Supabase project (never production). Preview builds
# need repo secrets, so they run only for same-repo PRs (forks can't read them).
on:
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/preview.yml'

jobs:
  preview:
    name: Cloudflare Pages preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build (against staging Supabase)
        working-directory: admin-web
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_ENV: preview
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npm ci && npm run build

      - name: Deploy preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A non-production --branch makes Cloudflare mint a unique preview URL.
          command: pages deploy admin-web/dist --project-name=${{ vars.CF_PAGES_PROJECT_PROD }} --branch=pr-${{ github.event.number }}
