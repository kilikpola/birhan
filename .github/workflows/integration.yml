name: Integration (RLS)

# Spins up a real local Supabase, applies every migration, and runs the RLS
# regression suite (supabase/tests/rls_regression.sql) — the policies that keep
# one church's data isolated from another's.
#
# Kept OFF the required-checks list until it's been seen green in Actions, since
# it couldn't be run in the authoring environment (no Docker/Deno there). Once
# green, add "Integration (RLS) / rls" to branch protection.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/integration.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'

jobs:
  rls:
    name: rls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start local Supabase (applies supabase/migrations/*)
        run: supabase start

      - name: Ensure a clean, fully-migrated DB
        run: supabase db reset

      - name: Run RLS regression suite
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_regression.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop || true
