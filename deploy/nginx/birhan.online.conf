# Birhan marketing site — birhan.online
#
# Install:  sudo cp deploy/nginx/birhan.online.conf /etc/nginx/sites-available/birhan.online
#           sudo ln -s /etc/nginx/sites-available/birhan.online /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run certbot AFTER this file is in place and DNS points here; it rewrites
# the listen directives and adds the certificate lines itself.
#           sudo certbot --nginx -d birhan.online -d www.birhan.online

server {
    listen 80;
    listen [::]:80;
    server_name birhan.online www.birhan.online;

    root /var/www/birhan;
    index index.html;

    access_log /var/log/nginx/birhan.access.log;
    error_log  /var/log/nginx/birhan.error.log;

    # Static marketing page — plain files, no SPA router.
    location / {
        try_files $uri $uri/ =404;
    }

    # The APK. Android needs this exact MIME type or the browser saves it as a
    # text file and the installer refuses to open it.
    location /downloads/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="birhan.apk"';
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
}
