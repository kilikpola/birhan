# Birhan update manifest — updates.birhan.online
#
# Serves /birhan/latest.json, which two different clients read:
#   * the Android app, checking whether a newer APK exists
#   * the download page on birhan.online, showing the current version and size
#
# Install:  sudo cp deploy/nginx/updates.birhan.online.conf /etc/nginx/sites-available/updates.birhan.online
#           sudo ln -s /etc/nginx/sites-available/updates.birhan.online /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# The TLS lines are added by Certbot on first issue; they are kept here so the
# file matches what is actually running, but a fresh host will not have the
# certificate until `certbot --nginx -d updates.birhan.online` has run.

server {
    server_name updates.birhan.online;
    root /var/www/updates.birhan.online;

    location / {
        default_type application/json;

        # Never cache the manifest. A stale one means someone is told they are
        # up to date when they are not.
        add_header Cache-Control "no-cache";

        # The download page on birhan.online fetches this cross-origin to show
        # the current version and size. Without this header the browser blocks
        # the read and the page falls back to its built-in placeholder. The app
        # is unaffected either way — native HTTP is not subject to CORS.
        add_header Access-Control-Allow-Origin "https://birhan.online" always;
        add_header Vary "Origin" always;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/updates.birhan.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/updates.birhan.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = updates.birhan.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name updates.birhan.online;
    return 404; # managed by Certbot
}
