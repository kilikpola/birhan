# Birhan admin console — admin.birhan.online
#
# A Vite SPA (admin-web/dist). Every route must fall back to index.html or a
# refresh on a sub-route 404s.
#
# Install:  sudo cp deploy/nginx/admin.birhan.online.conf /etc/nginx/sites-available/admin.birhan.online
#           sudo ln -s /etc/nginx/sites-available/admin.birhan.online /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d admin.birhan.online
#
# ACCESS: Supabase RLS is the real security boundary (only a super_admin can
# read anything), but the login form itself should not be world-reachable.
# Uncomment ONE of the two blocks below — HTTP basic auth or an IP allowlist.

server {
    listen 80;
    listen [::]:80;
    server_name admin.birhan.online;

    root /var/www/birhan-admin;
    index index.html;

    access_log /var/log/nginx/birhan-admin.access.log;
    error_log  /var/log/nginx/birhan-admin.error.log;

    # --- Defense in depth: pick one ------------------------------------
    # 1) Basic auth. Create the password file first:
    #      sudo apt install apache2-utils
    #      sudo htpasswd -c /etc/nginx/.birhan-admin-htpasswd <username>
    # auth_basic "Birhan admin";
    # auth_basic_user_file /etc/nginx/.birhan-admin-htpasswd;
    #
    # 2) IP allowlist (office / home static IP):
    # allow 203.0.113.7;
    # deny all;
    # -------------------------------------------------------------------

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or admins keep running an old bundle
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Source maps are uploaded to Sentry at build time; do not serve them.
    location ~* \.map$ {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
}
